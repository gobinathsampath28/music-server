<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Music</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           SIDEBAR
           ========================= */

        .sidebar {
            width: 230px;
            background: #181818;
            padding: 25px 15px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .nav-button {
            width: 100%;
            border: none;
            background: transparent;
            color: #bbb;
            padding: 13px 10px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .nav-button:hover {
            background: #282828;
            color: white;
        }

        .nav-button.active {
            background: #282828;
            color: white;
        }

        /* =========================
           MAIN
           ========================= */

        .main {
            margin-left: 230px;
            width: calc(100% - 230px);
            padding: 30px;
            padding-bottom: 150px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 30px;
            font-weight: bold;
        }

        .search {
            width: 350px;
            max-width: 100%;
            padding: 13px 18px;
            border-radius: 25px;
            border: none;
            outline: none;
            background: #282828;
            color: white;
            font-size: 15px;
        }

        .search::placeholder {
            color: #999;
        }

        /* =========================
           SONG LIST
           ========================= */

        .songs {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .song {
            display: grid;
            grid-template-columns: 45px 1fr 100px 70px 45px;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .song:hover {
            background: #282828;
        }

        .song-number {
            color: #888;
            text-align: center;
        }

        .song-info {
            min-width: 0;
        }

        .song-title {
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 13px;
            color: #999;
            margin-top: 4px;
        }

        .song-album {
            color: #aaa;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-duration {
            color: #aaa;
            font-size: 13px;
        }

        .favorite {
            border: none;
            background: transparent;
            color: #777;
            font-size: 20px;
            cursor: pointer;
        }

        .favorite.active {
            color: red;
        }

        /* =========================
           PLAYER
           ========================= */

        .player {
            position: fixed;
            left: 230px;
            right: 0;
            bottom: 0;
            height: 120px;
            background: #181818;
            border-top: 1px solid #333;
            padding: 15px 25px;
            z-index: 10;
        }

        .player-song {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .player-artist {
            color: #999;
            font-size: 12px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress {
            flex: 1;
            cursor: pointer;
        }

        .time {
            font-size: 11px;
            color: #aaa;
            width: 40px;
            text-align: center;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 8px;
        }

        .control {
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .play {
            font-size: 25px;
        }

        /* =========================
           PLAYLIST
           ========================= */

        .playlist-section {
            display: none;
        }

        .playlist-item {
            background: #181818;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .playlist-item:hover {
            background: #282828;
        }

        .playlist-name {
            font-size: 16px;
        }

        .playlist-count {
            color: #999;
            font-size: 13px;
            margin-top: 5px;
        }

        .create-playlist {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .create-playlist input {
            flex: 1;
            max-width: 350px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #282828;
            color: white;
        }

        .create-playlist button {
            border: none;
            border-radius: 6px;
            padding: 12px 18px;
            cursor: pointer;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 100%;
                height: 60px;
                bottom: auto;
                padding: 5px;
                display: flex;
                align-items: center;
                justify-content: space-around;
                z-index: 20;
            }

            .logo {
                display: none;
            }

            .nav-button {
                width: auto;
                padding: 10px;
                margin: 0;
                text-align: center;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
                padding-top: 80px;
                padding-bottom: 160px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .page-title {
                font-size: 24px;
            }

            .search {
                width: 100%;
            }

            .song {
                grid-template-columns: 30px 1fr 40px;
            }

            .song-album,
            .song-duration {
                display: none;
            }

            .player {
                left: 0;
                height: 145px;
                padding: 12px 15px;
            }

            .controls {
                margin-top: 12px;
            }
        }

    </style>

</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
         ========================= -->

    <aside class="sidebar">

        <div class="logo">
            🎵 My Music
        </div>

        <button class="nav-button active"
                onclick="showSongs()">
            🎵 Songs
        </button>

        <button class="nav-button"
                onclick="showFavorites()">
            ❤️ Favorites
        </button>

        <button class="nav-button"
                onclick="showPlaylists()">
            📂 Playlists
        </button>

    </aside>


    <!-- =========================
         MAIN
         ========================= -->

    <main class="main">

        <div class="top-bar">

            <div class="page-title"
                 id="pageTitle">
                Songs
            </div>

            <input
                    id="searchInput"
                    class="search"
                    type="text"
                    placeholder="Search songs, artists or albums..."
                    oninput="searchSongs()"
            >

        </div>


        <!-- SONGS -->

        <section id="songsSection">

            <div id="songList"
                 class="songs">
            </div>

        </section>


        <!-- PLAYLISTS -->

        <section id="playlistSection"
                 class="playlist-section">

            <div class="create-playlist">

                <input
                        id="playlistName"
                        placeholder="New playlist name"
                >

                <button onclick="createPlaylist()">
                    + Create
                </button>

            </div>

            <div id="playlistList">
            </div>

        </section>

    </main>

</div>


<!-- =========================
     PLAYER
     ========================= -->

<div class="player">

    <div class="player-song">

        <span id="currentTitle">
            Nothing playing
        </span>

        <div id="currentArtist"
             class="player-artist">
        </div>

    </div>


    <div class="progress-container">

        <span id="currentTime"
              class="time">
            0:00
        </span>

        <input
                id="progress"
                class="progress"
                type="range"
                min="0"
                max="100"
                value="0"
        >

        <span id="totalTime"
              class="time">
            0:00
        </span>

    </div>


    <div class="controls">

        <button class="control"
                onclick="previousSong()">
            ⏮
        </button>

        <button class="control play"
                id="playButton"
                onclick="togglePlay()">
            ▶
        </button>

        <button class="control"
                onclick="nextSong()">
            ⏭
        </button>

    </div>

</div>


<script>

    // =========================
    // VARIABLES
    // =========================

    let songs = [];

    let currentSongs = [];

    let currentIndex = -1;

    let audio = new Audio();

    let currentPlaylist = null;


    // =========================
    // INITIAL LOAD
    // =========================

    loadSongs();


    async function loadSongs() {

        try {

            const response =
                await fetch("/api/songs");

            songs =
                await response.json();

            currentSongs =
                songs;

            displaySongs(
                currentSongs
            );

        } catch (error) {

            console.error(error);

            document.getElementById(
                "songList"
            ).innerHTML =
                "<p>Unable to load songs.</p>";
        }
    }


    // =========================
    // DISPLAY SONGS
    // =========================

    function displaySongs(songList) {

        const container =
            document.getElementById(
                "songList"
            );

        container.innerHTML = "";

        if (songList.length === 0) {

            container.innerHTML =
                "<p>No songs found.</p>";

            return;
        }

        songList.forEach(
            (song, index) => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "song";

                row.innerHTML = `

                    <div class="song-number">
                        ${index + 1}
                    </div>

                    <div class="song-info"
                         onclick="playSongFromList(${index})">

                        <div class="song-title">
                            ${escapeHtml(song.title)}
                        </div>

                        <div class="song-artist">
                            ${escapeHtml(song.artist || "Unknown Artist")}
                        </div>

                    </div>

                    <div class="song-album">
                        ${escapeHtml(song.album || "Unknown Album")}
                    </div>

                    <div class="song-duration">
                        ${formatTime(song.duration)}
                    </div>

                    <button
                        class="favorite ${song.favorite ? "active" : ""}"
                        onclick="toggleFavorite(event, ${song.id})">
                        ♥
                    </button>
                `;

                container.appendChild(row);
            }
        );
    }


    // =========================
    // PLAY SONG
    // =========================

    function playSongFromList(index) {

        currentSongs =
            [...currentSongs];

        currentIndex =
            index;

        playCurrentSong();
    }


    function playCurrentSong() {

        if (
            currentIndex < 0 ||
            currentIndex >= currentSongs.length
        ) {
            return;
        }

        const song =
            currentSongs[currentIndex];

        audio.src =
            "/api/songs/"
            + encodeURIComponent(song.fileName)
            + "/stream";

        audio.play();

        document.getElementById(
            "currentTitle"
        ).textContent =
            song.title;

        document.getElementById(
            "currentArtist"
        ).textContent =
            song.artist || "Unknown Artist";

        document.getElementById(
            "playButton"
        ).textContent =
            "⏸";
    }


    // =========================
    // PLAY / PAUSE
    // =========================

    function togglePlay() {

        if (!audio.src) {

            if (currentSongs.length > 0) {

                currentIndex = 0;

                playCurrentSong();
            }

            return;
        }

        if (audio.paused) {

            audio.play();

            document.getElementById(
                "playButton"
            ).textContent = "⏸";

        } else {

            audio.pause();

            document.getElementById(
                "playButton"
            ).textContent = "▶";
        }
    }


    // =========================
    // NEXT
    // =========================

    function nextSong() {

        if (currentSongs.length === 0) {
            return;
        }

        currentIndex++;

        if (
            currentIndex >=
            currentSongs.length
        ) {
            currentIndex = 0;
        }

        playCurrentSong();
    }


    // =========================
    // PREVIOUS
    // =========================

    function previousSong() {

        if (currentSongs.length === 0) {
            return;
        }

        currentIndex--;

        if (currentIndex < 0) {

            currentIndex =
                currentSongs.length - 1;
        }

        playCurrentSong();
    }


    // =========================
    // AUTO NEXT
    // =========================

    audio.addEventListener(
        "ended",
        nextSong
    );


    // =========================
    // PROGRESS
    // =========================

    audio.addEventListener(
        "timeupdate",
        () => {

            if (!audio.duration) {
                return;
            }

            const percentage =
                (audio.currentTime /
                    audio.duration) *
                100;

            document.getElementById(
                "progress"
            ).value =
                percentage;

            document.getElementById(
                "currentTime"
            ).textContent =
                formatTime(
                    Math.floor(
                        audio.currentTime
                    )
                );

            document.getElementById(
                "totalTime"
            ).textContent =
                formatTime(
                    Math.floor(
                        audio.duration
                    )
                );
        }
    );


    document.getElementById(
        "progress"
    ).addEventListener(
        "input",
        function () {

            if (!audio.duration) {
                return;
            }

            audio.currentTime =
                (this.value / 100)
                * audio.duration;
        }
    );


    // =========================
    // SEARCH
    // =========================

    async function searchSongs() {

        const query =
            document.getElementById(
                "searchInput"
            ).value.trim();

        if (!query) {

            currentSongs =
                songs;

            displaySongs(
                currentSongs
            );

            return;
        }

        try {

            const response =
                await fetch(
                    "/api/songs/search?q="
                    + encodeURIComponent(query)
                );

            const result =
                await response.json();

            currentSongs =
                result;

            displaySongs(
                currentSongs
            );

        } catch (error) {

            console.error(error);
        }
    }


    // =========================
    // FAVORITES
    // =========================

    async function toggleFavorite(
        event,
        songId
    ) {

        event.stopPropagation();

        try {

            await fetch(
                "/api/songs/"
                + songId
                + "/favorite",
                {
                    method: "PUT"
                }
            );

            await loadSongs();

        } catch (error) {

            console.error(error);
        }
    }


    async function showFavorites() {

        setActiveNav();

        document.getElementById(
            "pageTitle"
        ).textContent =
            "Favorites";

        document.getElementById(
            "songsSection"
        ).style.display =
            "block";

        document.getElementById(
            "playlistSection"
        ).style.display =
            "none";

        document.getElementById(
            "searchInput"
        ).value = "";

        try {

            const response =
                await fetch(
                    "/api/songs/favorites"
                );

            currentSongs =
                await response.json();

            displaySongs(
                currentSongs
            );

        } catch (error) {

            console.error(error);
        }
    }


    // =========================
    // ALL SONGS
    // =========================

    function showSongs() {

        setActiveNav();

        document.getElementById(
            "pageTitle"
        ).textContent =
            "Songs";

        document.getElementById(
            "songsSection"
        ).style.display =
            "block";

        document.getElementById(
            "playlistSection"
        ).style.display =
            "none";

        document.getElementById(
            "searchInput"
        ).value = "";

        currentSongs =
            songs;

        displaySongs(
            currentSongs
        );
    }


    // =========================
    // PLAYLISTS
    // =========================

    async function showPlaylists() {

        setActiveNav();

        document.getElementById(
            "pageTitle"
        ).textContent =
            "Playlists";

        document.getElementById(
            "songsSection"
        ).style.display =
            "none";

        document.getElementById(
            "playlistSection"
        ).style.display =
            "block";

        document.getElementById(
            "searchInput"
        ).value = "";

        await loadPlaylists();
    }


    async function loadPlaylists() {

        try {

            const response =
                await fetch(
                    "/api/playlists"
                );

            const playlists =
                await response.json();

            const container =
                document.getElementById(
                    "playlistList"
                );

            container.innerHTML = "";

            if (playlists.length === 0) {

                container.innerHTML =
                    "<p>No playlists yet.</p>";

                return;
            }

            playlists.forEach(
                playlist => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "playlist-item";

                    item.onclick =
                        () => openPlaylist(
                            playlist.id
                        );

                    item.innerHTML = `

                        <div class="playlist-name">
                            📂 ${escapeHtml(playlist.name)}
                        </div>

                        <div class="playlist-count">
                            ${playlist.songs.length} songs
                        </div>

                    `;

                    container.appendChild(item);
                }
            );

        } catch (error) {

            console.error(error);
        }
    }


    async function createPlaylist() {

        const input =
            document.getElementById(
                "playlistName"
            );

        const name =
            input.value.trim();

        if (!name) {

            alert(
                "Enter a playlist name"
            );

            return;
        }

        try {

            await fetch(
                "/api/playlists?name="
                + encodeURIComponent(name),
                {
                    method: "POST"
                }
            );

            input.value = "";

            await loadPlaylists();

        } catch (error) {

            console.error(error);
        }
    }


    async function openPlaylist(
        playlistId
    ) {

        try {

            const response =
                await fetch(
                    "/api/playlists/"
                    + playlistId
                );

            const playlist =
                await response.json();

            document.getElementById(
                "pageTitle"
            ).textContent =
                playlist.name;

            document.getElementById(
                "songsSection"
            ).style.display =
                "block";

            document.getElementById(
                "playlistSection"
            ).style.display =
                "none";

            currentSongs =
                playlist.songs;

            displaySongs(
                currentSongs
            );

        } catch (error) {

            console.error(error);
        }
    }


    // =========================
    // NAVIGATION
    // =========================

    function setActiveNav() {

    document
        .querySelectorAll(
            ".nav-button"
        )
        .forEach(button => {

            button.classList.remove(
                "active"
            );
        });
}


    // =========================
    // FORMAT TIME
    // =========================

    function formatTime(seconds) {

        if (
            !seconds ||
            isNaN(seconds)
        ) {
            return "0:00";
        }

        const minutes =
            Math.floor(
                seconds / 60
            );

        const remaining =
            Math.floor(
                seconds % 60
            );

        return minutes
            + ":"
            + remaining
                .toString()
                .padStart(2, "0");
    }


    // =========================
    // SECURITY
    // =========================

    function escapeHtml(value) {

        if (!value) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

</script>

</body>

</html>
